name: neko-project-backend

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nekoBackend
      POSTGRES_USER: nekoBackend
      POSTGRES_PASSWORD: neko-local-postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nekoBackend -d nekoBackend"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "neko-local-redis"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a neko-local-redis ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/nekoBackend
      DB_USERNAME: nekoBackend
      DB_PASSWORD: neko-local-postgres
      DB_HIBERNATE_DDL_AUTO: update
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: neko-local-redis
      REDIS_DATABASE: 4
      JWT_SECRET: neko-local-docker-jwt-secret-change-before-production
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      FILE_BASE_URL: "${FILE_BASE_URL:-http://localhost:8080}"
      FILE_STORAGE_PATH: /app/storage
      ADMIN_SEED_ENABLED: "true"
      SEED_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - file-storage:/app/storage
      - audit-logs:/app/logs
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  file-storage:
  audit-logs:
