spring:
  application:
    name: NekoMainSite
  jmx:
    enabled: false
  profiles:
    default: local
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:8MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:10MB}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

neko:
  blessing-skin:
    enabled: ${BLESSING_SKIN_ENABLED:false}
    authorization-url: ${BLESSING_SKIN_AUTHORIZATION_URL:}
    token-url: ${BLESSING_SKIN_TOKEN_URL:}
    user-info-url: ${BLESSING_SKIN_USER_INFO_URL:}
    client-id: ${BLESSING_SKIN_CLIENT_ID:}
    client-secret: ${BLESSING_SKIN_CLIENT_SECRET:}
    redirect-uri: ${BLESSING_SKIN_REDIRECT_URI:http://127.0.0.1:8080/api/auth/blessing/callback}
    scope: ${BLESSING_SKIN_SCOPE:user}
    connect-timeout-ms: ${BLESSING_SKIN_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${BLESSING_SKIN_READ_TIMEOUT_MS:5000}
  security:
    password:
      argon2:
        salt-length: ${ARGON2_SALT_LENGTH:16}
        hash-length: ${ARGON2_HASH_LENGTH:32}
        parallelism: ${ARGON2_PARALLELISM:1}
        memory: ${ARGON2_MEMORY:16384}
        iterations: ${ARGON2_ITERATIONS:2}
    jwt:
      secret: ${JWT_SECRET:dev-secret-do-not-use-in-prod-please-override-via-JWT_SECRET}
      ttl-seconds: ${JWT_TTL_SECONDS:259200}
      cookie-secure: ${AUTH_COOKIE_SECURE:false}
    cors:
      allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3100,http://127.0.0.1:3100,http://localhost:3101,http://127.0.0.1:3101}
  file:
    storage-path: ${FILE_STORAGE_PATH:./storage}
    base-url: ${PUBLIC_BASE_URL:http://127.0.0.1:8080}
    image:
      allowed-extensions: jpg,jpeg,png,webp
      max-size-mb: 8
  server-status:
    enabled: ${SERVER_STATUS_ENABLED:false}
    interval-ms: ${SERVER_STATUS_INTERVAL_MS:60000}
    connect-timeout-ms: ${SERVER_STATUS_CONNECT_TIMEOUT_MS:3000}
