server:
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/neko_main_site}
    username: ${DATABASE_USERNAME:neko}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

neko:
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    display-name: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:站点管理员}
  security:
    jwt:
      cookie-secure: ${AUTH_COOKIE_SECURE:true}
    cors:
      allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS}
  file:
    base-url: ${PUBLIC_BASE_URL}
  server-status:
    enabled: ${SERVER_STATUS_ENABLED:true}
