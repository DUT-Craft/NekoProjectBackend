name: Verify Spring Boot backend

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Verify Gradle wrapper permissions
        run: test -x gradlew

      - name: Build and test
        run: ./gradlew --no-daemon clean test bootJar

      - name: Verify packaged application starts
        shell: bash
        run: |
          set -euo pipefail
          java -jar build/libs/NekoMainSite-0.0.1-SNAPSHOT.jar > application.log 2>&1 &
          app_pid=$!
          cleanup() {
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health > health.json; then
              ready=true
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat application.log
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            cat application.log
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:8080/api/public/home > home.json
